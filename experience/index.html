<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="『記憶都市（メモリオポリス）』のGitHub Pages入口。五言語の物語、制作ノート、数理モデル、Python観測窓を往還する作品です。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="記憶都市（メモリオポリス）">
  <meta property="og:description" content="五つの言語を往還し、数式とPythonへ降り、制作ノートから物語を読み返す。記憶都市の中央駅です。">
  <meta property="og:url" content="https://netarott.github.io/MEMORIOPOLIS/">
  <meta property="og:image" content="https://netarott.github.io/MEMORIOPOLIS/assets/images/memoriopolis-central-station-ogp.png">
  <meta property="og:image:alt" content="記憶都市（メモリオポリス）中央駅">
  <meta name="twitter:card" content="summary_large_image">
  <title>記憶都市（メモリオポリス）</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #05090d;
      --paper: #e8ebed;
      --muted: #aab2b9;
      --cyan: #83d8df;
      --line: rgba(131, 216, 223, .34);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      color: var(--paper);
      background:
        radial-gradient(circle at 74% 22%, rgba(36, 93, 104, .20), transparent 34%),
        radial-gradient(circle at 24% 76%, rgba(28, 63, 78, .20), transparent 38%),
        var(--page);
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans JP", sans-serif;
    }

    main {
      width: min(62rem, 88vw);
      padding: 10vh 0;
    }

    .eyebrow {
      margin: 0 0 1.2rem;
      color: var(--cyan);
      font-size: .72rem;
      letter-spacing: .22em;
    }

    h1 {
      margin: 0;
      font-weight: 500;
      font-size: clamp(2.8rem, 8vw, 7rem);
      line-height: 1.18;
      letter-spacing: .04em;
    }

    .reading {
      margin: 1rem 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.35rem);
      letter-spacing: .08em;
    }

    .description {
      max-width: 46rem;
      margin: 3.2rem 0;
      color: #d6dcde;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
      font-size: clamp(1rem, 1.7vw, 1.22rem);
      line-height: 2.1;
    }

    .station {
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid var(--line);
    }

    .station h2 {
      margin: 0 0 .8rem;
      font-weight: 500;
      font-size: clamp(1.4rem, 3vw, 2.2rem);
    }

    .station p {
      margin: 0 0 1.8rem;
      color: var(--muted);
      line-height: 1.8;
    }

    .enter {
      display: inline-block;
      padding: .8rem 1.15rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #e4f0f2;
      background: rgba(6, 16, 23, .74);
      text-decoration: none;
    }

    .enter:hover,
    .enter:focus-visible {
      color: #fff;
      outline: 1px solid var(--cyan);
    }

    footer {
      margin-top: 5rem;
      color: #7f8b91;
      font-size: .78rem;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">MEMORIOPOLIS / CENTRAL STATION</p>
    <h1>記憶都市</h1>
    <p class="reading">メモリオポリス</p>

    <p class="description">
      五つの言語を往還し、数式とPythonへ降り、制作ノートから物語を読み返す。
      ここは、完成を固定するためではなく、変化の履歴を保ちながら作品世界へ入るための中央駅です。
    </p>

    <section class="station" aria-labelledby="section09-title">
      <p class="eyebrow">OPEN PLATFORM</p>
      <h2 id="section09-title">第四章 第九節</h2>
      <p>「まだ送られていない矢印」</p>
      <a class="enter" href="chapter04/section09/">第九節をひらく</a>
    </section>

    <footer>
      GitHub Repositoryは正本と制作制度を記憶し、GitHub Pagesは作品世界への入口になります。
    </footer>
  </main>
</body>
</html>
