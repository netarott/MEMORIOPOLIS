<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>記憶都市 | 第四章第九節</title>
  <link rel="stylesheet" href="styles.css">

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']],
        processEscapes: true
      },
      startup: {
        typeset: false
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
</head>
<body>
  <header class="hud">
    <a class="brand" href="#top">記憶都市（メモリオポリス）</a>
    <div class="hud-actions">
      <nav class="language-switcher" aria-label="表示言語">
        <button type="button" data-language="ja" aria-pressed="true">日本語</button>
        <button type="button" data-language="en" aria-pressed="false">English</button>
        <button type="button" data-language="zh-TW" aria-pressed="false">繁體中文</button>
        <button type="button" data-language="ko" aria-pressed="false">한국어</button>
        <button type="button" data-language="ru" aria-pressed="false">Русский</button>
      </nav>
      <button id="sound" class="sound-button" type="button" aria-pressed="false">BGMをひらく</button>
    </div>
  </header>

  <main id="top">
    <section class="hero scene-01" aria-labelledby="section-title">
      <div class="hero-copy">
        <p class="eyebrow">CHAPTER 04 / SECTION 09</p>
        <h1 id="section-title">読み込み中...</h1>
        <p id="load-status" class="status" role="status" aria-live="polite">五言語正本から生成されたデータを読み込んでいます。</p>
        <a class="continue-link" href="#story">本文をひらく</a>
      </div>
    </section>

    <section id="story" class="story scene-02" aria-label="第四章第九節 本文">
      <article id="section-content" class="story-content" aria-live="polite"></article>
      <p id="build-state" class="build-state" hidden>LOCALIZATION_READY</p>
    </section>
  </main>

  <audio id="bgm" preload="metadata" loop>
    <source src="audio/two-clocks-before-dawn-prototype01.wav" type="audio/wav">
  </audio>

  <script src="script.js"></script>
</body>
</html>
