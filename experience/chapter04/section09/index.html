<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>記憶都市 | 第四章第九節</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hud">
    <span>記憶都市（メモリオポリス）</span>
    <button id="sound" type="button" aria-pressed="false">BGMをひらく</button>
  </header>

  <main>
    <section class="scene scene-01" aria-label="第一景 まだ送られていない">
      <div class="copy">
        <p class="eyebrow">CHAPTER 04 / SECTION 09</p>
        <h1>まだ送られていない矢印</h1>
        <p>問い合わせは、まだ送られていない。</p>
        <p>けれど内部では、調査も時間も、すでに動いている。</p>
        <p class="hint">下へ進む</p>
      </div>
    </section>

    <section class="scene scene-02" aria-label="第二景 別の時計が始まる">
      <div class="copy">
        <p class="eyebrow">SCENE 02</p>
        <h2>別の時計が始まる。</h2>
        <p>送信しても、内部の時計は止まらない。</p>
        <p>外側に、もうひとつの時間が加わる。</p>
        <p>そのあいだにあった一拍が、誰のものだったのかは、決めない。</p>
      </div>
    </section>
  </main>

  <audio id="bgm" preload="metadata" loop>
    <source src="audio/two-clocks-before-dawn-prototype01.wav" type="audio/wav">
  </audio>

  <script src="script.js"></script>
</body>
</html>
