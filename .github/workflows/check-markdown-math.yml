name: Check Markdown Math Style

on:
  push:
    paths:
      - "novel/**/*.md"
      - "scripts/check_markdown_math.py"
      - ".github/workflows/check-markdown-math.yml"

  pull_request:
    paths:
      - "novel/**/*.md"
      - "scripts/check_markdown_math.py"
      - ".github/workflows/check-markdown-math.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-markdown-math:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Markdown math style
        run: python scripts/check_markdown_math.py
